log_format argo_json escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
  '"method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
  '"duration":$request_time,"upstream":"$upstream_addr","upstream_time":"$upstream_response_time",'
  '"user_agent":"$http_user_agent"}';

map $http_x_request_id $argo_request_id {
  "~^[A-Za-z0-9._-]{1,64}$" $http_x_request_id;
  default $request_id;
}

limit_req_zone $binary_remote_addr zone=argo_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=argo_api:10m rate=30r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    client_max_body_size 2m;
    server_tokens off;
    access_log /var/log/nginx/access.log argo_json;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/csv;

    include /etc/nginx/security_headers.conf;

    root /usr/share/nginx/html;

    error_page 429 = @rate_limited;
    error_page 502 503 504 = @unavailable;
    location @rate_limited {
        default_type application/json;
        return 429 '{"code":"rate_limited","message":"Muitas tentativas. Aguarde um minuto e tente de novo.","fields":{}}';
    }
    location @unavailable {
        default_type application/json;
        return 503 '{"code":"service_unavailable","message":"Serviço temporariamente indisponível. Tente de novo em instantes.","fields":{}}';
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location ~ ^/api/(identity|catalog|orders|billing)/?$ { return 301 /docs/?servico=$1; }

    location ~ ^/api/(identity|catalog|orders|billing)/internal/ {
        default_type application/json;
        return 404 '{"code":"not_found","message":"Rota não encontrada.","fields":{}}';
    }

    location ~ ^/api/identity/auth/(login|register)$ {
        limit_req zone=argo_auth burst=10 nodelay;
        proxy_pass http://identity:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location ^~ /api/identity/ {
        limit_req zone=argo_api burst=60 nodelay;
        proxy_pass http://identity:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location ^~ /api/catalog/stock/stream {
        proxy_pass http://catalog:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $argo_request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Internal-Token "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }

    location ^~ /api/catalog/ {
        limit_req zone=argo_api burst=60 nodelay;
        proxy_pass http://catalog:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location ^~ /api/orders/ {
        limit_req zone=argo_api burst=60 nodelay;
        proxy_pass http://orders:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location ^~ /api/billing/ {
        limit_req zone=argo_api burst=60 nodelay;
        proxy_pass http://billing:8080/api/billing/;
        include /etc/nginx/proxy_params.conf;
    }

    location ^~ /docs/vendor/ {
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/security_headers.conf;
    }

    location /docs/ {
        try_files $uri $uri/ /docs/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security_headers.conf;
    }

    location ~* \.(css|js|webmanifest)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security_headers.conf;
    }

    location ~* \.(svg|woff2|png|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/security_headers.conf;
    }
}
