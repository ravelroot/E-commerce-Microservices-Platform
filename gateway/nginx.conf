server {
    listen 80;
    server_name _;
    client_max_body_size 2m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    root /usr/share/nginx/html;

    # Os serviços Django já respondem em /api/<serviço>/, então o caminho segue inteiro.
    location ~ ^/api/(identity|catalog|orders|billing)/?$ { return 301 /docs/?servico=$1; }

    location /api/identity/ {
        proxy_pass http://identity:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/catalog/stock/stream {
        proxy_pass http://catalog:8000;
        include /etc/nginx/proxy_params.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }

    location /api/catalog/ {
        proxy_pass http://catalog:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/orders/ {
        proxy_pass http://orders:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/billing/ {
        proxy_pass http://billing:8080/api/billing/;
        include /etc/nginx/proxy_params.conf;
    }

    location /docs/ {
        try_files $uri $uri/ /docs/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|svg|woff2|png)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
