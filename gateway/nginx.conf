# Limite de tentativas por IP no login e no cadastro (complementa o bloqueio de conta da identidade).
limit_req_zone $binary_remote_addr zone=argo_auth:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    client_max_body_size 2m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    include /etc/nginx/security_headers.conf;

    root /usr/share/nginx/html;

    # Erros do próprio gateway no mesmo formato JSON dos serviços.
    error_page 429 = @rate_limited;
    error_page 502 503 504 = @unavailable;
    location @rate_limited {
        default_type application/json;
        return 429 '{"code":"rate_limited","message":"Muitas tentativas. Aguarde um minuto e tente de novo.","fields":{}}';
    }
    location @unavailable {
        default_type application/json;
        return 503 '{"code":"service_unavailable","message":"Serviço temporariamente indisponível. Tente de novo em instantes.","fields":{}}';
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    # Os serviços Django já respondem em /api/<serviço>/, então o caminho segue inteiro.
    location ~ ^/api/(identity|catalog|orders|billing)/?$ { return 301 /docs/?servico=$1; }

    # Rotas /internal/* só existem na rede interna do Docker (serviço chama serviço direto).
    location ~ ^/api/(identity|catalog|orders|billing)/internal/ {
        default_type application/json;
        return 404 '{"code":"not_found","message":"Rota não encontrada.","fields":{}}';
    }

    location ~ ^/api/identity/auth/(login|register)$ {
        limit_req zone=argo_auth burst=10 nodelay;
        proxy_pass http://identity:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location ^~ /api/identity/ {
        proxy_pass http://identity:8000;
        include /etc/nginx/proxy_params.conf;
    }

    # Server-Sent Events: sem buffer e com conexão longa (por isso não usa o proxy_params.conf).
    location ^~ /api/catalog/stock/stream {
        proxy_pass http://catalog:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Internal-Token "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }

    location ^~ /api/catalog/ {
        proxy_pass http://catalog:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location ^~ /api/orders/ {
        proxy_pass http://orders:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location ^~ /api/billing/ {
        proxy_pass http://billing:8080/api/billing/;
        include /etc/nginx/proxy_params.conf;
    }

    location /docs/ {
        try_files $uri $uri/ /docs/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # JS e CSS revalidam a cada carga (ETag), então uma versão nova aparece na hora.
    # Quem define add_header perde os herdados do server: por isso o include de novo.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security_headers.conf;
    }

    location ~* \.(svg|woff2|png)$ {
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/security_headers.conf;
    }
}
