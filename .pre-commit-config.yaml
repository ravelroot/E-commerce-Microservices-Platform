repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
        exclude: ^web/docs/vendor/
      - id: end-of-file-fixer
        exclude: \.(pdf|png|woff2)$
      - id: trailing-whitespace
        exclude: \.md$
